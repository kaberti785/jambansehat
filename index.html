+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/figtree/v9/_Xms-HUzqDCFdgfMm4q9DbZs.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"94b4e270-fb58-452a-8a8c-70bbbcd6c939\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#f7f4ed;color:#1c1c1c;font-family:'Figtree',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\nhtml{scroll-behavior:smooth}\na{color:#1c1c1c}\na:focus-visible,button:focus-visible{outline:none;box-shadow:0 0 0 2px #f7f4ed,0 0 0 4px rgba(59,130,246,0.7)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%;background:#f7f4ed;overflow-x:hidden\" data-canvas-width=\"1440\" data-canvas-height=\"6800\" data-document-role=\"page\" data-label=\"Penggunaan Jamban Sehat\">\n\n<!-- nav -->\n<div style=\"max-width:1200px;margin:0 auto;padding:20px 24px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px\">\n<a href=\"#atas\" style=\"display:flex;align-items:center;gap:12px;text-decoration:none;color:#1c1c1c\">\n<img src=\"d2f35da2-082e-4fdb-87e4-d12851090da7\" alt=\"Logo Universitas Muhammadiyah Kalimantan Timur\" style=\"width:40px;height:40px;object-fit:contain\">\n<span style=\"font-size:18px;font-weight:600;letter-spacing:-0.2px\">Jamban Sehat<\u002Fspan>\n<\u002Fa>\n<div style=\"display:flex;gap:24px;flex-wrap:wrap;font-size:15px\">\n<a href=\"#tujuan\" style=\"text-decoration:none;color:rgba(28,28,28,0.82)\">Tujuan<\u002Fa>\n<a href=\"#pengertian\" style=\"text-decoration:none;color:rgba(28,28,28,0.82)\">Materi<\u002Fa>\n<a href=\"#kriteria\" style=\"text-decoration:none;color:rgba(28,28,28,0.82)\">Syarat<\u002Fa>\n<a href=\"#dampak\" style=\"text-decoration:none;color:rgba(28,28,28,0.82)\">Dampak BABS<\u002Fa>\n<a href=\"#acara\" style=\"text-decoration:none;color:rgba(28,28,28,0.82)\">Acara<\u002Fa>\n<\u002Fdiv>\n<a href=\"#tim\" style=\"background:#1c1c1c;color:#fcfbf8;text-decoration:none;font-size:15px;padding:8px 16px;border-radius:6px;box-shadow:rgba(255,255,255,0.2) 0px 0.5px 0px 0px inset, rgba(0,0,0,0.2) 0px 0px 0px 0.5px inset, rgba(0,0,0,0.05) 0px 1px 2px 0px\">Tim penyuluh<\u002Fa>\n<\u002Fdiv>\n\n<!-- hero -->\n<div id=\"atas\" style=\"background:radial-gradient(ellipse 60% 70% at 15% 0%, rgba(244,184,160,0.28), rgba(247,244,237,0) 70%), radial-gradient(ellipse 55% 70% at 90% 10%, rgba(176,200,235,0.26), rgba(247,244,237,0) 70%);\">\n<div style=\"max-width:1200px;margin:0 auto;padding:96px 24px 72px;box-sizing:border-box;text-align:center\">\n<div style=\"display:inline-block;border:1px solid #eceae4;border-radius:9999px;padding:6px 14px;font-size:14px;color:#5f5f5d;background:#f7f4ed\">Kesehatan Lingkungan · Satuan Acara Penyuluhan<\u002Fdiv>\n<h1 style=\"margin:28px auto 0;font-size:clamp(40px,7vw,72px);font-weight:600;line-height:1.05;letter-spacing:-0.025em;max-width:900px;color:#1c1c1c\">Penggunaan Jamban Sehat<\u002Fh1>\n<p style=\"margin:24px auto 0;font-size:18px;line-height:1.5;color:#5f5f5d;max-width:620px\">Pengertian, manfaat, syarat, dampak buang air besar sembarangan, dan cara merawat jamban, untuk masyarakat dan ibu rumah tangga.<\u002Fp>\n<div style=\"margin-top:36px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap\">\n<a href=\"#kriteria\" style=\"background:#1c1c1c;color:#fcfbf8;text-decoration:none;font-size:16px;padding:10px 20px;border-radius:6px;box-shadow:rgba(255,255,255,0.2) 0px 0.5px 0px 0px inset, rgba(0,0,0,0.2) 0px 0px 0px 0.5px inset, rgba(0,0,0,0.05) 0px 1px 2px 0px\">Cek syarat jamban sehat<\u002Fa>\n<a href=\"#pengertian\" style=\"background:transparent;color:#1c1c1c;text-decoration:none;font-size:16px;padding:10px 20px;border-radius:6px;border:1px solid rgba(28,28,28,0.4)\">Mulai dari pengertian<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- stats -->\n<div style=\"max-width:1200px;margin:0 auto;padding:0 24px;box-sizing:border-box\">\n<div style=\"display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid #eceae4;border-bottom:1px solid #eceae4;padding:40px 0\">\n<div style=\"flex:1 1 240px;min-width:0\">\n<div style=\"font-size:48px;font-weight:600;letter-spacing:-1.2px;line-height:1\">30<\u002Fdiv>\n<div style=\"margin-top:8px;font-size:16px;line-height:1.5;color:#5f5f5d\">menit penyuluhan di balai desa atau posyandu<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 240px;min-width:0\">\n<div style=\"font-size:48px;font-weight:600;letter-spacing:-1.2px;line-height:1\">10 m<\u002Fdiv>\n<div style=\"margin-top:8px;font-size:16px;line-height:1.5;color:#5f5f5d\">jarak minimal lubang penampungan kotoran dari sumur<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 240px;min-width:0\">\n<div style=\"font-size:48px;font-weight:600;letter-spacing:-1.2px;line-height:1\">5<\u002Fdiv>\n<div style=\"margin-top:8px;font-size:16px;line-height:1.5;color:#5f5f5d\">penyakit berbasis lingkungan yang dicegah: diare, kolera, disentri, tipus, kecacingan<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- tujuan -->\n<div id=\"tujuan\" style=\"max-width:1200px;margin:128px auto 0;padding:0 24px;box-sizing:border-box;display:flex;gap:64px;flex-wrap:wrap\">\n<div style=\"flex:1 1 360px;min-width:0\">\n<div style=\"font-size:14px;color:#5f5f5d\">Tujuan penyuluhan<\u002Fdiv>\n<h2 style=\"margin:12px 0 0;font-size:clamp(32px,4.5vw,48px);font-weight:600;line-height:1.05;letter-spacing:-1.2px\">Peserta paham, lalu mau menerapkan<\u002Fh2>\n<p style=\"margin:20px 0 0;font-size:18px;line-height:1.5;color:#5f5f5d\">Setelah penyuluhan selama 30 menit, peserta memahami pentingnya penggunaan jamban sehat dan mampu menerapkannya dalam kehidupan sehari-hari.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1.3 1 460px;min-width:0\">\n<sc-for list=\"{{tujuan}}\" as=\"t\" hint-placeholder-count=\"5\">\n<div style=\"display:flex;gap:20px;padding:20px 0;border-top:1px solid #eceae4;font-size:18px;line-height:1.5;color:rgba(28,28,28,0.82)\">\n<span style=\"min-width:28px;color:#5f5f5d;font-size:16px;padding-top:2px\">{{t.no}}<\u002Fspan><span>{{t.text}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"border-top:1px solid #eceae4\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- pengertian -->\n<div id=\"pengertian\" style=\"max-width:1200px;margin:128px auto 0;padding:0 24px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">01 · Pengertian<\u002Fdiv>\n<h2 style=\"margin:12px 0 0;font-size:clamp(32px,4.5vw,48px);font-weight:600;line-height:1.05;letter-spacing:-1.2px;max-width:820px\">Apa yang disebut jamban sehat<\u002Fh2>\n<p style=\"margin:24px 0 0;font-size:20px;line-height:1.5;color:rgba(28,28,28,0.82);max-width:860px\">Jamban sehat adalah ruangan yang memiliki fasilitas pembuangan kotoran manusia dan memenuhi syarat kesehatan. Fasilitas itu terdiri dari tiga bagian.<\u002Fp>\n<div style=\"margin-top:40px;display:flex;gap:20px;flex-wrap:wrap\">\n<div style=\"flex:1 1 280px;min-width:0;border:1px solid #eceae4;border-radius:12px;padding:28px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">Bagian 1<\u002Fdiv>\n<div style=\"margin-top:8px;font-size:22px;font-weight:600;letter-spacing:-0.3px\">Tempat jongkok atau duduk<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d\">Dengan leher angsa, atau tanpa leher angsa (cemplung).<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 280px;min-width:0;border:1px solid #eceae4;border-radius:12px;padding:28px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">Bagian 2<\u002Fdiv>\n<div style=\"margin-top:8px;font-size:22px;font-weight:600;letter-spacing:-0.3px\">Unit penampungan kotoran<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d\">Tempat kotoran tertampung dan terisolasi dari lingkungan.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 280px;min-width:0;border:1px solid #eceae4;border-radius:12px;padding:28px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">Bagian 3<\u002Fdiv>\n<div style=\"margin-top:8px;font-size:22px;font-weight:600;letter-spacing:-0.3px\">Air untuk membersihkan<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d\">Air tersedia di dalam jamban untuk membilas dan membersihkan diri.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- manfaat -->\n<div style=\"max-width:1200px;margin:128px auto 0;padding:0 24px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">02 · Manfaat<\u002Fdiv>\n<h2 style=\"margin:12px 0 0;font-size:clamp(32px,4.5vw,48px);font-weight:600;line-height:1.05;letter-spacing:-1.2px;max-width:820px\">Untuk keluarga dan lingkungan<\u002Fh2>\n<div style=\"margin-top:40px;display:flex;gap:20px;flex-wrap:wrap\">\n<sc-for list=\"{{manfaat}}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"flex:1 1 260px;min-width:0;background:#fcfbf8;border:1px solid #eceae4;border-radius:12px;padding:28px;box-sizing:border-box\">\n<div style=\"font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-0.3px\">{{m.title}}<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d\">{{m.body}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- kriteria -->\n<div id=\"kriteria\" style=\"max-width:1200px;margin:128px auto 0;padding:0 24px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">03 · Syarat jamban sehat<\u002Fdiv>\n<h2 style=\"margin:12px 0 0;font-size:clamp(32px,4.5vw,48px);font-weight:600;line-height:1.05;letter-spacing:-1.2px;max-width:820px\">Enam syarat menurut standar kesehatan<\u002Fh2>\n<p style=\"margin:20px 0 0;font-size:18px;line-height:1.5;color:#5f5f5d;max-width:700px\">Ketuk syarat yang sudah dipenuhi jamban di rumah Anda. Ini hanya alat bantu belajar, tidak disimpan.<\u002Fp>\n\n<div style=\"margin-top:40px;display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start\">\n<div style=\"flex:2 1 520px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n<sc-for list=\"{{syarat}}\" as=\"s\" hint-placeholder-count=\"6\">\n<button sc-camel-on-click=\"{{ s.toggle }}\" aria-pressed=\"{{ s.pressed }}\" style=\"{{ s.style }}\">\n<span style=\"{{ s.boxStyle }}\">{{s.mark}}<\u002Fspan>\n<span style=\"display:flex;flex-direction:column;gap:4px;min-width:0;flex:1\">\n<span style=\"font-size:18px;font-weight:600;letter-spacing:-0.2px;color:#1c1c1c\">{{s.title}}<\u002Fspan>\n<span style=\"font-size:16px;line-height:1.5;color:#5f5f5d\">{{s.body}}<\u002Fspan>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex:1 1 280px;min-width:0;background:#1c1c1c;color:#fcfbf8;border-radius:16px;padding:32px;box-sizing:border-box;align-self:flex-start\">\n<div style=\"font-size:14px;color:#c9c7c0\">Terpenuhi<\u002Fdiv>\n<div style=\"margin-top:8px;font-size:72px;font-weight:600;letter-spacing:-1.8px;line-height:1\">{{count}}<span style=\"font-size:32px;color:#c9c7c0;letter-spacing:-0.5px\"> / 6<\u002Fspan><\u002Fdiv>\n<p style=\"margin:20px 0 0;font-size:16px;line-height:1.5;color:#e4e2db\">{{verdict}}<\u002Fp>\n<button sc-camel-on-click=\"{{ reset }}\" style=\"margin-top:24px;background:transparent;color:#fcfbf8;border:1px solid rgba(252,251,248,0.4);border-radius:6px;padding:8px 16px;font-family:inherit;font-size:15px;cursor:pointer\">Kosongkan<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- jarak -->\n<div style=\"margin-top:56px;border:1px solid #eceae4;border-radius:16px;padding:32px;box-sizing:border-box;background:#fcfbf8\">\n<div style=\"font-size:14px;color:#5f5f5d\">Jarak aman<\u002Fdiv>\n<div style=\"margin-top:8px;font-size:22px;font-weight:600;letter-spacing:-0.3px\">Lubang penampungan kotoran dan sumur<\u002Fdiv>\n<div style=\"margin-top:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n<div style=\"flex:0 0 auto;background:#1c1c1c;color:#fcfbf8;border-radius:8px;padding:16px 20px;font-size:16px\">Septic tank<\u002Fdiv>\n<div style=\"flex:1 1 160px;min-width:120px;display:flex;flex-direction:column;align-items:center;gap:6px\">\n<div style=\"font-size:16px;font-weight:600\">minimal 10 meter<\u002Fdiv>\n<div style=\"width:100%;border-top:2px dashed rgba(28,28,28,0.5)\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 0 auto;border:1px solid rgba(28,28,28,0.4);border-radius:8px;padding:16px 20px;font-size:16px\">Sumur / sumber air minum<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:24px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d;max-width:720px\">Jarak ini menjaga agar bakteri dari kotoran tidak meresap ke air yang diminum keluarga.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- dampak -->\n<div id=\"dampak\" style=\"max-width:1200px;margin:128px auto 0;padding:0 24px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">04 · Dampak buruk BABS<\u002Fdiv>\n<h2 style=\"margin:12px 0 0;font-size:clamp(32px,4.5vw,48px);font-weight:600;line-height:1.05;letter-spacing:-1.2px;max-width:860px\">Buang air besar sembarangan merugikan semua orang di sekitarnya<\u002Fh2>\n\n<div style=\"margin-top:40px;display:flex;gap:12px;flex-wrap:wrap;align-items:stretch\">\n<div style=\"flex:1 1 180px;min-width:0;border:1px solid rgba(28,28,28,0.4);border-radius:12px;padding:20px;box-sizing:border-box;font-size:16px;line-height:1.4\"><div style=\"font-size:14px;color:#5f5f5d\">Langkah 1<\u002Fdiv><div style=\"margin-top:6px;font-weight:600\">Kotoran dibiarkan terbuka<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 180px;min-width:0;border:1px solid rgba(28,28,28,0.4);border-radius:12px;padding:20px;box-sizing:border-box;font-size:16px;line-height:1.4\"><div style=\"font-size:14px;color:#5f5f5d\">Langkah 2<\u002Fdiv><div style=\"margin-top:6px;font-weight:600\">Lalat hinggap di kotoran<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 180px;min-width:0;border:1px solid rgba(28,28,28,0.4);border-radius:12px;padding:20px;box-sizing:border-box;font-size:16px;line-height:1.4\"><div style=\"font-size:14px;color:#5f5f5d\">Langkah 3<\u002Fdiv><div style=\"margin-top:6px;font-weight:600\">Lalu hinggap di makanan<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 180px;min-width:0;background:#1c1c1c;color:#fcfbf8;border-radius:12px;padding:20px;box-sizing:border-box;font-size:16px;line-height:1.4\"><div style=\"font-size:14px;color:#c9c7c0\">Akibat<\u002Fdiv><div style=\"margin-top:6px;font-weight:600\">Wabah diare<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:20px;display:flex;gap:20px;flex-wrap:wrap\">\n<sc-for list=\"{{dampak}}\" as=\"d\" hint-placeholder-count=\"3\">\n<div style=\"flex:1 1 300px;min-width:0;background:#fcfbf8;border:1px solid #eceae4;border-radius:12px;padding:28px;box-sizing:border-box\">\n<div style=\"font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-0.3px\">{{d.title}}<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d\">{{d.body}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- pemeliharaan -->\n<div id=\"rawat\" style=\"max-width:1200px;margin:128px auto 0;padding:0 24px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">05 · Pemeliharaan<\u002Fdiv>\n<h2 style=\"margin:12px 0 0;font-size:clamp(32px,4.5vw,48px);font-weight:600;line-height:1.05;letter-spacing:-1.2px;max-width:820px\">Merawat jamban sehari-hari<\u002Fh2>\n<div style=\"margin-top:40px;display:flex;gap:20px;flex-wrap:wrap\">\n<div style=\"flex:1 1 300px;min-width:0;border:1px solid #eceae4;border-radius:16px;padding:32px;box-sizing:border-box\">\n<div style=\"display:inline-block;border-radius:9999px;background:#1c1c1c;color:#fcfbf8;font-size:14px;padding:4px 12px\">Lakukan<\u002Fdiv>\n<div style=\"margin-top:20px;font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-0.3px\">Bersihkan secara teratur<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d\">Bersihkan lantai dan mangkuk jamban memakai karbol atau pembersih lantai.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;border:1px solid #eceae4;border-radius:16px;padding:32px;box-sizing:border-box\">\n<div style=\"display:inline-block;border-radius:9999px;border:1px solid rgba(28,28,28,0.4);font-size:14px;padding:3px 12px\">Hindari<\u002Fdiv>\n<div style=\"margin-top:20px;font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-0.3px\">Air sabun pekat dan detergen berlebih<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d\">Jangan menyiramkannya ke lubang leher angsa. Bahan itu membunuh bakteri pengurai di dalam septic tank.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;border:1px solid #eceae4;border-radius:16px;padding:32px;box-sizing:border-box\">\n<div style=\"display:inline-block;border-radius:9999px;background:#1c1c1c;color:#fcfbf8;font-size:14px;padding:4px 12px\">Sediakan<\u002Fdiv>\n<div style=\"margin-top:20px;font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-0.3px\">Tempat sampah di dalam bilik<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d\">Untuk membuang tisu atau pembalut supaya tidak menyumbat saluran.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- acara -->\n<div id=\"acara\" style=\"max-width:1200px;margin:128px auto 0;padding:0 24px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">Jalannya penyuluhan<\u002Fdiv>\n<h2 style=\"margin:12px 0 0;font-size:clamp(32px,4.5vw,48px);font-weight:600;line-height:1.05;letter-spacing:-1.2px;max-width:820px\">Tiga tahap dalam 30 menit<\u002Fh2>\n<p style=\"margin:20px 0 0;font-size:18px;line-height:1.5;color:#5f5f5d;max-width:700px\">Metode ceramah, tanya jawab, dan diskusi interaktif. Media: lembar balik, poster, leaflet, atau LCD proyektor. Tempat: balai desa atau posyandu.<\u002Fp>\n<div style=\"margin-top:40px;display:flex;gap:20px;flex-wrap:wrap\">\n<sc-for list=\"{{tahap}}\" as=\"s\" hint-placeholder-count=\"3\">\n<div style=\"flex:1 1 320px;min-width:0;border:1px solid #eceae4;border-radius:16px;padding:32px;box-sizing:border-box\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n<div style=\"font-size:24px;font-weight:600;letter-spacing:-0.4px\">{{s.nama}}<\u002Fdiv>\n<div style=\"font-size:15px;color:#5f5f5d\">{{s.waktu}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:20px;font-size:14px;color:#5f5f5d\">Penyuluh<\u002Fdiv>\n<ul style=\"margin:8px 0 0;padding-left:18px;font-size:16px;line-height:1.55;color:rgba(28,28,28,0.82)\">\n<sc-for list=\"{{s.penyuluh}}\" as=\"p\" hint-placeholder-count=\"3\"><li>{{p.text}}<\u002Fli><\u002Fsc-for>\n<\u002Ful>\n<div style=\"margin-top:20px;font-size:14px;color:#5f5f5d\">Peserta<\u002Fdiv>\n<ul style=\"margin:8px 0 0;padding-left:18px;font-size:16px;line-height:1.55;color:rgba(28,28,28,0.82)\">\n<sc-for list=\"{{s.peserta}}\" as=\"p\" hint-placeholder-count=\"2\"><li>{{p.text}}<\u002Fli><\u002Fsc-for>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"margin-top:20px;border:1px solid #eceae4;border-radius:16px;padding:32px;box-sizing:border-box;background:#fcfbf8;display:flex;gap:40px;flex-wrap:wrap\">\n<div style=\"flex:1 1 260px;min-width:0\">\n<div style=\"font-size:14px;color:#5f5f5d\">Evaluasi<\u002Fdiv>\n<div style=\"margin-top:8px;font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-0.6px\">Peserta diharapkan mampu<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:2 1 440px;min-width:0\">\n<sc-for list=\"{{evaluasi}}\" as=\"e\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;gap:20px;padding:14px 0;border-top:1px solid #eceae4;font-size:17px;line-height:1.5;color:rgba(28,28,28,0.82)\"><span style=\"min-width:24px;color:#5f5f5d\">{{e.no}}<\u002Fspan><span>{{e.text}}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- tim -->\n<div id=\"tim\" style=\"max-width:1200px;margin:128px auto 0;padding:0 24px;box-sizing:border-box\">\n<div style=\"font-size:14px;color:#5f5f5d\">Pelaksana<\u002Fdiv>\n<h2 style=\"margin:12px 0 0;font-size:clamp(32px,4.5vw,48px);font-weight:600;line-height:1.05;letter-spacing:-1.2px;max-width:820px\">Dosen pengampu dan tim penyuluh<\u002Fh2>\n\n<div style=\"margin-top:40px;background:#1c1c1c;color:#fcfbf8;border-radius:16px;padding:40px;box-sizing:border-box;display:flex;gap:32px;flex-wrap:wrap;align-items:center\">\n<img src=\"d2f35da2-082e-4fdb-87e4-d12851090da7\" alt=\"Logo UMKT\" style=\"width:96px;height:96px;object-fit:contain;flex:0 0 auto\">\n<div style=\"flex:1 1 320px;min-width:0\">\n<div style=\"font-size:14px;color:#c9c7c0\">Dosen pengampu mata kuliah<\u002Fdiv>\n<div style=\"margin-top:10px;font-size:clamp(26px,3.6vw,40px);font-weight:600;line-height:1.1;letter-spacing:-1px\">Ns. Faried Rahman Hidayat, S.Kep., M.Kes<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 240px;min-width:0;font-size:16px;line-height:1.5;color:#e4e2db\">\n<div style=\"color:#c9c7c0;font-size:14px\">Mata kuliah<\u002Fdiv>\n<div>PROMOSI KESEHATAN<br><br><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:28px;font-size:14px;color:#5f5f5d\">Tim penyuluh · Kelompok 5<\u002Fdiv>\n<div style=\"margin-top:12px;display:flex;gap:20px;flex-wrap:wrap\">\n<sc-for list=\"{{tim}}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"flex:1 1 240px;min-width:0;background:#fcfbf8;border:1px solid #eceae4;border-radius:12px;padding:28px;box-sizing:border-box\">\n<div style=\"width:48px;height:48px;border-radius:9999px;background:#eceae4;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#1c1c1c\">{{m.inisial}}<\u002Fdiv>\n<div style=\"margin-top:20px;font-size:20px;font-weight:600;line-height:1.25;letter-spacing:-0.2px\">{{m.nama}}<\u002Fdiv>\n<div style=\"margin-top:6px;font-size:15px;color:#5f5f5d\">NIM {{m.nim}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin:28px 0 0;font-size:16px;line-height:1.5;color:#5f5f5d\">Program Studi DIII Keperawatan, Fakultas Ilmu Keperawatan, Universitas Muhammadiyah Kalimantan Timur, 2026.<\u002Fp>\n<\u002Fdiv>\n\n<!-- footer -->\n<div style=\"max-width:1200px;margin:128px auto 0;padding:0 24px 48px;box-sizing:border-box\">\n<div style=\"border:1px solid #eceae4;border-radius:16px;padding:40px;box-sizing:border-box;background:radial-gradient(ellipse 70% 120% at 100% 100%, rgba(244,184,160,0.25), rgba(247,244,237,0) 70%);display:flex;gap:40px;flex-wrap:wrap;justify-content:space-between;align-items:center\">\n<div style=\"display:flex;gap:16px;align-items:center;flex:1 1 320px;min-width:0\">\n<img src=\"d2f35da2-082e-4fdb-87e4-d12851090da7\" alt=\"Logo UMKT\" style=\"width:56px;height:56px;object-fit:contain\">\n<div>\n<div style=\"font-size:18px;font-weight:600;letter-spacing:-0.2px\">Universitas Muhammadiyah Kalimantan Timur<\u002Fdiv>\n<div style=\"margin-top:4px;font-size:14px;color:#5f5f5d\">Fakultas Ilmu Keperawatan · Program Studi DIII Keperawatan<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 280px;min-width:0;font-size:14px;line-height:1.6;color:#5f5f5d\">Media penyuluhan Penggunaan Jamban Sehat, disusun dari Satuan Acara Penyuluhan Kelompok 5. Dosen pengampu: Ns. Faried Rahman Hidayat, S.Kep., M.Kes.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6800}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { checked: [false, false, false, false, false, false] };\n  }\n  renderVals() {\n    const N = (arr) => arr.map((text, i) => ({ no: String(i + 1).padStart(2, '0'), text }));\n    const T = (arr) => arr.map((text) => ({ text }));\n\n    const tujuan = N([\n      'Menjelaskan pengertian jamban sehat secara mandiri.',\n      'Menyebutkan manfaat menggunakan jamban sehat dengan benar.',\n      'Menjelaskan kriteria atau syarat rumah tangga yang memiliki jamban sehat.',\n      'Menjelaskan dampak buruk dari buang air besar sembarangan (BABS).',\n      'Memahami cara memelihara jamban agar tetap bersih dan sehat.'\n    ]);\n\n    const manfaat = [\n      { title: 'Mencegah penularan penyakit', body: 'Memutus mata rantai penyakit berbasis lingkungan seperti diare, kolera, disentri, tipus, dan kecacingan.' },\n      { title: 'Menjaga kebersihan lingkungan', body: 'Menghindari pencemaran tanah, permukaan air, dan sumber air minum di sekitar rumah.' },\n      { title: 'Estetika dan kenyamanan', body: 'Lingkungan lebih bersih, rapi, tidak berbau, dan meningkatkan kenyamanan serta martabat keluarga.' },\n      { title: 'Privasi dan keamanan', body: 'Rasa aman dan terjaga privasinya saat buang air besar, terutama pada malam hari.' }\n    ];\n\n    const base = [\n      { title: 'Tidak mencemari sumber air minum', body: 'Jarak lubang penampungan kotoran (septic tank) minimal 10 meter dari sumur atau sumber air minum.' },\n      { title: 'Tidak berbau', body: 'Kotoran tidak dapat dijamah lalat, kecoak, atau tikus. Sebaiknya menggunakan model leher angsa.' },\n      { title: 'Mudah dibersihkan', body: 'Lantai kedap air dan dibuat miring ke arah saluran pembuangan agar air tidak tergenang.' },\n      { title: 'Dilengkapi dinding dan atap', body: 'Menjamin privasi dan kenyamanan pengguna dari panas maupun hujan.' },\n      { title: 'Penerangan dan ventilasi cukup', body: 'Udara mengalir lancar dan pencemaran udara di dalam ruangan dapat diminimalkan.' },\n      { title: 'Tersedia air bersih dan sabun', body: 'Untuk membersihkan diri setelah buang air dan membilas jamban.' }\n    ];\n    const checked = this.state.checked;\n    const syarat = base.map((s, i) => {\n      const on = checked[i];\n      return {\n        title: s.title,\n        body: s.body,\n        mark: on ? '✓' : '',\n        pressed: on ? 'true' : 'false',\n        toggle: () => {\n          const next = this.state.checked.slice();\n          next[i] = !next[i];\n          this.setState({ checked: next });\n        },\n        style: 'display:flex;gap:16px;align-items:flex-start;text-align:left;width:100%;box-sizing:border-box;padding:20px;border-radius:12px;cursor:pointer;font-family:inherit;border:1px solid ' + (on ? 'rgba(28,28,28,0.4)' : '#eceae4') + ';background:' + (on ? '#fcfbf8' : 'transparent') + ';',\n        boxStyle: 'flex:0 0 auto;width:28px;height:28px;border-radius:6px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;border:1px solid rgba(28,28,28,0.4);' + (on ? 'background:#1c1c1c;color:#fcfbf8;' : 'background:transparent;color:#1c1c1c;')\n      };\n    });\n    const count = checked.filter(Boolean).length;\n    let verdict = 'Pilih syarat yang sudah dipenuhi untuk melihat hasilnya.';\n    if (count > 0 && count < 6) verdict = 'Masih ada ' + (6 - count) + ' syarat yang perlu dilengkapi agar jamban memenuhi standar kesehatan.';\n    if (count === 6) verdict = 'Semua syarat terpenuhi. Tetap rawat jamban secara teratur.';\n\n    const dampak = [\n      { title: 'Penyebaran wabah diare', body: 'Lalat hinggap di kotoran yang terbuka, lalu hinggap di makanan manusia.' },\n      { title: 'Pencemaran air tanah', body: 'Bakteri E. coli dapat meresap ke sumur warga jika pembuangan kotoran tidak diisolasi dengan benar.' },\n      { title: 'Penurunan kualitas hidup', body: 'Lingkungan yang kotor memicu tingginya angka kesakitan, terutama pada balita yang berisiko stunting.' }\n    ];\n\n    const tahap = [\n      { nama: 'Pembukaan', waktu: '5 menit',\n        penyuluh: T(['Mengucapkan salam dan memperkenalkan diri', 'Menjelaskan tujuan kegiatan penyuluhan', 'Apersepsi dan kontrak waktu']),\n        peserta: T(['Menjawab salam', 'Mendengarkan dan memperhatikan', 'Menyetujui kontrak waktu']) },\n      { nama: 'Penyampaian materi dan diskusi', waktu: '20 menit',\n        penyuluh: T(['Menjelaskan pengertian, manfaat, dan syarat jamban sehat', 'Menjelaskan dampak BABS', 'Menjelaskan cara merawat jamban', 'Memberi kesempatan bertanya']),\n        peserta: T(['Menyimak penjelasan dengan seksama', 'Mengajukan pertanyaan tentang materi yang kurang dipahami']) },\n      { nama: 'Evaluasi dan penutup', waktu: '5 menit',\n        penyuluh: T(['Mengajukan pertanyaan evaluasi', 'Menyimpulkan inti materi bersama peserta', 'Memberi apresiasi atas partisipasi', 'Terima kasih dan salam penutup']),\n        peserta: T(['Menjawab pertanyaan evaluasi', 'Memperhatikan kesimpulan', 'Menjawab salam penutup']) }\n    ];\n\n    const evaluasi = N([\n      'Menyebutkan kembali definisi jamban sehat dengan bahasa sendiri.',\n      'Menyebutkan minimal 3 manfaat menggunakan jamban sehat.',\n      'Menyebutkan minimal 4 kriteria utama jamban sehat, misalnya tidak mencemari sumber air dan bebas dari serangga.',\n      'Menjelaskan bahaya penyakit yang ditularkan lewat kotoran manusia jika tidak menggunakan jamban.'\n    ]);\n\n    const tim = [\n      { nama: 'Arina Tasya', nim: '2511102416103', inisial: 'A' },\n      { nama: 'Chairun Nisa', nim: '2511102416014', inisial: 'C' },\n      { nama: 'Salsabila', nim: '2511102416068', inisial: 'S' },\n      { nama: 'Gina Andriyani', nim: '2511102416044', inisial: 'G' }\n    ];\n\n    return {\n      tujuan, manfaat, syarat, count, verdict,\n      reset: () => this.setState({ checked: [false, false, false, false, false, false] }),\n      dampak, tahap, evaluasi, tim\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
